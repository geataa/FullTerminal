name: Build and Release FullTerminal

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish the version tag at this commit (tag must already exist)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build FullTerminal via MSVC
        shell: cmd
        run: call build.bat

      - name: Set up Python for integration tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SSH loopback test dependency
        run: python -m pip install --target build/ssh-test-deps paramiko==5.0.0

      - name: Run test suite
        shell: cmd
        run: call tests\run_all_tests.bat

      - name: Package portable distribution and verify versions
        shell: pwsh
        run: ./tools/Package-Release.ps1 -Publishing:($env:PUBLISH_RELEASE -eq 'true')

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FullTerminal-Windows-x64
          if-no-files-found: error
          path: |
            dist/FullTerminal.exe
            dist/FullTerminal-*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FullTerminal.exe
            dist/${{ env.ZIP_NAME }}
            dist/FullTerminal-Portable-x64.zip
            dist/FullTerminal-Rebuild-Sources.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: FullTerminal ${{ env.RELEASE_TAG }} — Database & Terminal Workspace
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          draft: false
          prerelease: false
          generate_release_notes: false
