name: Build and Release FullTerminal (Debian / Ubuntu Linux x64)

on:
  push:
    branches: [debian]
    tags: ['v*-debian*']
  pull_request:
    branches: [debian]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release v1.2.0-debian from this branch'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag to publish when create_release is enabled'
        required: false
        default: 'v1.2.0-debian'
        type: string

permissions:
  contents: read

jobs:
  build-debian:
    name: Build, Test & Package Debian / Ubuntu x64
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build & headless X11/OpenGL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake bison flex m4 perl curl \
            libx11-dev libxi-dev libgl1-mesa-dev libfreetype6-dev libfontconfig1-dev \
            xvfb xauth mesa-utils libgl1-mesa-dri fonts-ubuntu fonts-noto-color-emoji \
            python3 python3-pil file libfuse2 openssh-client

      - name: Cache static native database & TLS libraries
        uses: actions/cache@v4
        with:
          path: build/native-installed/x64-linux-static
          key: ft-linux-native-static-${{ hashFiles('tools/build_native_clients_linux.sh', 'vendor/native/*') }}

      - name: Build static native client libraries & FullTerminal binary
        run: |
          chmod +x tools/build_native_clients_linux.sh
          ./tools/build_native_clients_linux.sh
          make -j"$(nproc)" build/fullterminal

      - name: Run automated Linux test suite under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24 +extension GLX +render -noreset" make -j"$(nproc)" test

      - name: Package .deb, AppImage, Portable Tarball & SHA256SUMS
        run: |
          chmod +x packaging/package_release_linux.sh
          ./packaging/package_release_linux.sh

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="$(sed -n 's/^#define FT_VERSION "\(.*\)"/\1/p' src/core/Version.h | tr -d '\r')"
          VERSION="${VERSION:-1.2.0}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${VERSION}-debian"
          fi
          NOTES="docs/releases/${TAG}.md"
          if [[ ! -f "${NOTES}" ]]; then
            NOTES="docs/releases/v${VERSION}-debian.md"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FullTerminal-Debian-Linux-x64
          if-no-files-found: error
          path: |
            dist/fullterminal_*_amd64.deb
            dist/FullTerminal-*-x86_64.AppImage
            dist/FullTerminal-*-linux-x64-portable.tar.gz
            dist/fullterminal
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fullterminal_${{ steps.meta.outputs.version }}_amd64.deb
            dist/FullTerminal-${{ steps.meta.outputs.version }}-x86_64.AppImage
            dist/FullTerminal-${{ steps.meta.outputs.version }}-linux-x64-portable.tar.gz
            dist/fullterminal
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FullTerminal v${{ steps.meta.outputs.version }} (Debian / Ubuntu Linux x64) — Database & Terminal Workspace
          body_path: ${{ steps.meta.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: false
